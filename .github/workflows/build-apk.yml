name: Build APK (debug)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: client

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências (npm install)
        run: npm install

      # Faz: vite build -> npx cap add android -> patch do AndroidManifest -> npx cap sync android
      - name: Gerar o projeto Android (Capacitor)
        run: npm run android:setup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'http://10.0.2.2:3001' }}

      - name: Compilar app-debug.apk
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: quintal-app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
