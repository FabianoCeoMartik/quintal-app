name: Build APK (debug)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Capacitor 6 -> compileSdk/targetSdk 34, Gradle 8.2 / AGP 8.2.1, Java 17
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  # Variáveis do Vite: são gravadas no app durante o "npm run build".
  # VITE_SOCKET_URL tem um valor padrão caso o secret não exista.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'http://10.0.2.2:3001' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: client

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Falha cedo e com mensagem clara se os secrets não existirem
      # (sem eles o APK abre só a tela de "Configuração incompleta").
      - name: Verificar variáveis de ambiente (secrets)
        run: |
          missing=0
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Secret VITE_SUPABASE_URL não configurado (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Secret VITE_SUPABASE_ANON_KEY não configurado (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          echo "VITE_SOCKET_URL em uso: ${VITE_SOCKET_URL}"
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Variáveis OK."

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK; aqui só localizamos,
      # aceitamos as licenças e instalamos platform + build-tools.
      - name: Configurar Android SDK
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "cmdline-tools não encontrado em $SDK, baixando..."
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Aceitar licenças (o 'yes' pode terminar com SIGPIPE/141: ignoramos esse código)
          set +e
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /tmp/licenses.log 2>&1
          set -e
          tail -n 5 /tmp/licenses.log || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

      # Garante acesso ONLINE ao Gradle (sem --offline), com repositórios corretos
      # (Google + Maven Central + espelho do Google), timeouts maiores e retries.
      - name: Configurar Gradle (online, repositórios e timeouts)
        run: |
          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=6
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF

          # Init script: adiciona os repositórios tanto para o classpath do plugin (AGP/Kotlin)
          # quanto para as dependências dos módulos, mesmo que o projeto gerado não os declare.
          cat > "$HOME/.gradle/init.d/repos.gradle" <<'EOF'
          allprojects {
            buildscript {
              repositories {
                google()
                maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              mavenCentral()
            }
          }
          EOF

          echo "== gradle.properties =="; cat "$HOME/.gradle/gradle.properties"

      - name: Testar acesso aos repositórios Maven (diagnóstico)
        continue-on-error: true
        run: |
          for url in \
            "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom" \
            "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.2.1/gradle-8.2.1.pom"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "falhou")
            echo "$code  $url"
          done

      - name: Instalar dependências (npm install)
        run: npm install

      # 1) Build do client COM as variáveis VITE_* injetadas (ficam gravadas em dist/)
      - name: Build do client (npm run build)
        run: |
          npm run build
          test -f dist/index.html
          echo "== dist/index.html =="; cat dist/index.html

      # 2) Cria o projeto Android do Capacitor e aplica o patch do manifest
      - name: Criar projeto Android (cap add + patch)
        run: |
          npx cap add android
          node scripts/patch-android.mjs

      # 3) Copia o dist/ (já com as variáveis) para dentro do projeto Android
      - name: Sincronizar Capacitor (cap sync android)
        run: npx cap sync android

      - name: Apontar o Gradle para o SDK
        working-directory: client/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compilar app-debug.apk
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          # Online (sem --offline). Até 3 tentativas: falhas de rede ao baixar
          # kotlin-stdlib/AGP costumam ser temporárias.
          for attempt in 1 2 3; do
            echo "=== Tentativa $attempt de 3 ==="
            EXTRA=""
            if [ "$attempt" -gt 1 ]; then EXTRA="--refresh-dependencies"; fi
            if ./gradlew assembleDebug --no-daemon --stacktrace $EXTRA; then
              exit 0
            fi
            echo "Falhou na tentativa $attempt; aguardando antes de tentar de novo..."
            sleep 20
          done
          echo "Todas as tentativas falharam."
          exit 1

      - name: Publicar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: quintal-app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
